version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: barber-db
    environment:
      POSTGRES_DB: barber_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: barber-app:latest
    container_name: barber-app-container
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/barber_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456789
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: L9qsw53EIQ8vRJHH6E8aGgB2P/FRvvu3iL3CqHx/7IjkeWJAVh1YF7qXqzR4gAvTzZP+zGU7VuhtmK+OQEXAyQ==
      SPRING_SERVLET_MULTIPART_ENABLED: true
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      LOGGING_LEVEL_COM_EXAMPLE_DEMO_CONTROLLER_ANUNTCONTROLLER: DEBUG

volumes:
  postgres-data:
